<!DOCTYPE html>
<html>
  <head>
    <title>Legacy Launcher</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <style>
      @font-face {
        font-family: Mojangles;
        src: url('assets/Mojangles.ttf');
      }
      .mainmenu {
        font-family: Mojangles;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 58px;
      }
      .menubutton {
        image-rendering: pixelated;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      button.menubutton:nth-of-type(1) {
        margin-top: 87px;
      }
    </style>
  </head>
  <body>
    <div class="mainmenu">
      <img src="assets/Logo.png" alt="Logo">
      <button type="button" class="menubutton">
        <img src="assets/MainMenuButton_Norm.png">
      </button>
      <button type="button" class="menubutton">
        <img src="assets/MainMenuButton_Norm.png">
      </button>
      <button type="button" class="menubutton">
        <img src="assets/MainMenuButton_Norm.png">
      </button>
    </div>
  </body>
</html>
