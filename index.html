<!DOCTYPE html>
<html>
  <head>
    <title>Legacy Launcher</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <style>
      @font-face {
        font-family: Mojangles;
        src: url("assets/Mojangles.ttf");
      }
      .menu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .menubutton {
        background-image: url("assets/MainMenuButton_Norm.png");
        border: none;
        image-rendering: pixelated;
        width: 450px;
        height: 40px;
        color: white;
        text-shadow: 1px 1px black;
        font-family: "Mojangles";
        font-size: 16px;
      }
      .menubutton:hover {
        background-image: url("assets/MainMenuButton_Over.png");
        color: yellow;
      }
    </style>
  </head>
  <body>
    <div class="menu">
      <button class="menubutton">Install Game</button>
      <button class="menubutton">Help & Options</button>
      <button class="menubutton">Exit Launcher</button>
    </div>
  </body>
</html>
