<!DOCTYPE html>
<html>
  <head>
    <title>Legacy Launcher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <style>
      @font-face {
        font-family: Mojangles;
        src: url('assets/Mojangles.ttf');
      }
      .mainmenu {
        font-family: Mojangles;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 58px;
      }
      .menubutton {
        image-rendering: pixelated;
        background: none;
        border: none;
        cursor: pointer;
      }
      .menubutton .hover-img {
        display: none;
      }
      .menubutton:hover .norm-img {
        display: none;
      }
      .menubutton:hover .hover-img {
        display: block;
      }
      button.menubutton:nth-of-type(1) {
        margin-top: 87px;
      }
    </style>
  </head>
  <body>
    <div class="mainmenu">
      <img src="assets/Logo.png" alt="Logo">
      <button type="button" class="menubutton">
        <img src="assets/MainMenuButton_Norm.png" class="norm-img">
        <img src="assets/MainMenuButton_Over.png" class="hover-img">
      </button>
      <button type="button" class="menubutton">
        <img src="assets/MainMenuButton_Norm.png" class="norm-img">
        <img src="assets/MainMenuButton_Over.png" class="hover-img">
      </button>
      <button type="button" class="menubutton">
        <img src="assets/MainMenuButton_Norm.png" class="norm-img">
        <img src="assets/MainMenuButton_Over.png" class="hover-img">
      </button>
    </div>
  </body>
</html>
